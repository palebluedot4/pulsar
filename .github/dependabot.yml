# Version updates wait out a cooldown, so a compromised release has time to be
# caught and pulled before it is proposed here; security updates are exempt.
# There is no npm entry: Dependabot cannot update a pnpm 12 lockfile, so the
# Node tools are bumped by hand. Alerts for them still come from the
# dependency graph (docs/harness.md).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      tools:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /examples
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      examples:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
