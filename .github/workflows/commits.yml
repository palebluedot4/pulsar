# Its own workflow so that editing a pull request's title reruns this check,
# and only this check: a rerun replays the original event, old title and all.
name: Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Untrusted text reaches the script through the environment, never by
      # expression interpolation into the shell. A pull request that
      # dependabot[bot] opened is checked with --dependabot, which allows its
      # case and length; the opener's login is GitHub's to set, not the
      # pull request's.
      - name: Check the pull request title and every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          OPENER: ${{ github.event.pull_request.user.login }}
        run: |
          mode=()
          if [ "$OPENER" = "dependabot[bot]" ]; then
            mode=(--dependabot)
          fi
          msg=$(mktemp)
          printf '%s\n' "$TITLE" > "$msg"
          scripts/check-commit-msg.sh "${mode[@]}" "$msg"
          for sha in $(git rev-list --no-merges "$BASE_SHA..HEAD"); do
            git log -1 --format=%B "$sha" > "$msg"
            scripts/check-commit-msg.sh "${mode[@]}" "$msg"
          done
