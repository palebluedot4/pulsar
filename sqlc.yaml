# sqlc generates each domain package's query code from its queries.sql and
# the goose migrations, which are the one schema. The generated code
# imports only pgx. `make sqlc` regenerates it; `make check` fails when it
# is stale.
version: "2"
sql:
  - engine: postgresql
    schema: internal/postgres/migrations
    queries: internal/signing/queries.sql
    gen:
      go:
        package: queries
        out: internal/signing/internal/queries
        sql_package: pgx/v5
        overrides:
          - db_type: timestamptz
            go_type: time.Time
  - engine: postgresql
    schema: internal/postgres/migrations
    queries: internal/login/queries.sql
    gen:
      go:
        package: queries
        out: internal/login/internal/queries
        sql_package: pgx/v5
        overrides:
          - db_type: timestamptz
            go_type: time.Time
