# go-mutesting's configuration for make mutation (docs/mutation-testing.md).
# Most files of internal/oidc have no test file of their own, since
# internal/server tests them over HTTP, so files without tests are mutated
# too; scripts/mutation-exec.sh runs every package's tests.
skip_without_test: false
skip_with_build_tags: false
json_output: true
silent_mode: false
exclude_dirs: []
